; DreamGUI demo project -- DreamGUI settings.

[/Script/DreamGUI.DreamGUISettings]
; Backspace is a Back key as well: Escape can be eaten before it reaches the game when a window is driven
; from outside (the NieR screens were recorded that way). The list replaces the class default, so the
; default keys are written out again.
+BackKeys=Escape
+BackKeys=Gamepad_FaceButton_Right
+BackKeys=BackSpace

; The demo is in Chinese: controls that draw their own text (expandable areas, ring menus...) need the CJK font.
DefaultFont=/DreamGUI/DefaultFont_DistanceField_CJK.DefaultFont_DistanceField_CJK
