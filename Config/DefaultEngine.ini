; DreamGUI demo project -- engine config.
;
; The renderer and target-platform values are the DreamShader / DreamDynamicWorld test hosts', verbatim:
; all run on the same installed engine and these values feed the shader cache keys, so agreeing on them
; reads the shader derived data those hosts have already warmed. No derived-data-cache section: the
; machine-wide local Zen store is the cache in use.

[/Script/EngineSettings.GameMapsSettings]
; NOCTURNE//OS: open the project, press Play, and it starts at its title (NocturneGameMode, no -DemoShot = play).
EditorStartupMap=/Game/Nocturne/Maps/Nocturne_Demo.Nocturne_Demo
GameDefaultMap=/Game/Nocturne/Maps/Nocturne_Demo.Nocturne_Demo

[/Script/Engine.Engine]
; DreamGUI's viewport client: text fields get characters through InputChar (right on any keyboard layout).
GameViewportClientClassName=/Script/DreamGUIInput.DreamGameViewportClient

[/Script/Engine.RendererSettings]
r.AllowStaticLighting=False
r.Shadow.Virtual.Enable=1
r.GenerateMeshDistanceFields=True
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.SkinCache.CompileShaders=True
r.RayTracing=True
r.RayTracing.RayTracingProxies.ProjectEnabled=True
r.Substrate=True
r.Substrate.ProjectGBufferFormat=0
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
r.DefaultFeature.LocalExposure.HighlightContrastScale=0.8
r.DefaultFeature.LocalExposure.ShadowContrastScale=0.8

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
-D3D12TargetedShaderFormats=PCD3D_SM5
+D3D12TargetedShaderFormats=PCD3D_SM6
-D3D11TargetedShaderFormats=PCD3D_SM5
+D3D11TargetedShaderFormats=PCD3D_SM5

[/Script/HardwareTargeting.HardwareTargetingSettings]
TargetedHardwareClass=Desktop
AppliedTargetedHardwareClass=Desktop
DefaultGraphicsPerformance=Maximum
AppliedDefaultGraphicsPerformance=Maximum

[/Script/Engine.UserInterfaceSettings]
bAuthorizeAutomaticWidgetVariableCreation=False
FontDPIPreset=Standard
FontDPI=72

[/Script/DreamGUI.DreamUISettings]
; 4x MSAA on DreamGUI's own render paths: cleaner edges in the recordings.
AntiAliasingMethod=MSAA
MSAASampleCount=Four

[/Script/DreamShader.DreamShaderSettings]
SourceDirectory=(Path="DShader")
; Graph-backed materials load in -game (the Detroit materials were made that way).
DefaultBackend=Graph
; Only the project's DShader/ is compiled. DreamGUI ships its own DShader/ next to the materials it
; generated; scanning it would rebuild those plugin assets inside the worktree.
bScanPluginSourceDirectories=False

[DevOptions.Shaders]
PercentageUnusedShaderCompilingThreads=25

[/Script/AndroidRuntimeSettings.AndroidRuntimeSettings]
PackageName=com.typedreammoon.demogallery
ApplicationDisplayName=DreamGUI Gallery
StoreVersion=3
VersionDisplayName=1.2
Orientation=SensorLandscape
bPackageDataInsideApk=True
bEnableBundle=False
